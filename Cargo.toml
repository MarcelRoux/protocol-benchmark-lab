[workspace]
resolver = "2"
members = ["orchestrator", "services/rust"]

[workspace.dependencies]
axum = { version = "0.8.9" }
chrono = { version = "0.4.9" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = [
    "default",
    "rt-multi-thread",
    "signal",
    "time",
    "fs",
] }
tower-http = { version = "0.6.8", features = ["timeout", "trace"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing = { version = "0.1.44" }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
yaml_serde = { version = "0.10.4" }
