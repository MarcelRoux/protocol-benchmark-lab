[workspace]
resolver = "2"
members = ["services/rust"]

[workspace.dependencies]
axum = { version = " 0.8.9" }
tokio = { version = "1.52.1", features = [
    "default",
    "rt-multi-thread",
    "signal",
    "time",
] }
tower-http = { version = "0.6.8", features = ["timeout", "trace"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing = { version = "0.1.44" }
